name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & Build
    runs-on: ubuntu-latest

    env:
      # Placeholders for CI — real values live in Vercel project settings
      NEXT_PUBLIC_STUDIO_NAME: Ashwath Artist
      NEXT_PUBLIC_STUDIO_TAGLINE: From Imagination to Skin & Canvas
      NEXT_PUBLIC_WHATSAPP_NUMBER: "918494958165"
      NEXT_PUBLIC_PHONE: "+91 84949 58165"
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
